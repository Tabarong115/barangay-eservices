services:
  - type: web
    name: barangay-eservices
    env: python
    plan: free
    buildCommand: pip install -r requirements-prod.txt
    startCommand: gunicorn --bind 0.0.0.0:$PORT app:app
    healthCheckPath: /
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.13
      - key: SECRET_KEY
        generateValue: true
      - key: FLASK_ENV
        value: production
      - key: REQUIRE_SUPABASE
        value: true
